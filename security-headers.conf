# Included in every location: nginx drops server-level add_header directives in
# any location that declares its own.
# The app only needs its own assets plus the homeserver. 'wasm-unsafe-eval' is
# required by the Rust crypto module.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob:; connect-src 'self' https: http: wss: ws:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
