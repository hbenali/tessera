name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Tessera is a personal project, so it helps to say what problem you want solved rather than only the feature. Please look through the [open issues](https://github.com/hbenali/tessera/issues) and the README's list of what works first.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is this?
      options:
        - New feature
        - Improvement to an existing feature
        - Appearance, layout or accessibility
        - Notifications
        - Security or privacy
        - Deployment (Docker, hosting)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The situation, and what is hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: The behaviour, names of options, or a sketch of the screen, if you have an idea.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you do today, how other Matrix clients handle it, and whether an existing option nearly covers it.
  - type: dropdown
    id: device
    attributes:
      label: Where would you use it?
      multiple: true
      options:
        - Desktop browser
        - Phone or tablet browser
        - Installed app
        - Self-hosted deployment
