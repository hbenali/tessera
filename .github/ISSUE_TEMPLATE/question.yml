name: Question or help
description: You are stuck, or not sure how something is meant to work
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Please look at the [wiki](https://github.com/hbenali/tessera/wiki) and the [Troubleshooting page](https://github.com/hbenali/tessera/wiki/Troubleshooting) first. If something is plainly broken, use the Bug report form instead.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried, and what happened?
      description: The steps, any message you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Tessera details (optional)
      description: In Tessera, Settings, About, Copy details for a bug report. You can delete the `User` line.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed passwords, tokens and private data from everything above.
          required: true
