name: tessera CodeQL configuration

# security-extended = the default security queries plus additional
# lower-precision security queries (still no pure code-quality noise).
queries:
  - uses: security-extended

paths-ignore:
  # not our code
  - node_modules
  - vendor
  # browser-test harness: throwaway local users and the SHA-1 HMAC that Synapse's admin API requires
  - app/e2e
  # test inputs, sample content and docs
  - test/fixtures
  - testdata
  - docs
